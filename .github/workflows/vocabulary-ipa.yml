name: Vocabulary tests and unsigned iPad IPA
on:
  workflow_dispatch:
    inputs:
      test_targets:
        description: Space separated XCTest/Swift Testing targets
        required: true
        default: vreaderTests/SchemaV10SourceKeyMigrationTests
      package_ipa:
        description: Build and upload unsigned physical-device IPA
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: vocabulary-${{ github.ref }}-${{ inputs.test_targets }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.2 compatible Xcode
        run: |
          XCODE=$(python3 -c 'import glob,re; p=[x for x in glob.glob("/Applications/Xcode_26.6*.app") if "beta" not in x.lower() and "rc" not in x.lower()]; print(max(p,key=lambda x: [int(n) for n in re.findall(r"\d+",x)]))')
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Record source and toolchain
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          xcodebuild -version | tee evidence/xcode.txt
          xcrun --sdk iphoneos --show-sdk-version >> evidence/xcode.txt
      - name: Select focused test sources
        env:
          TEST_TARGETS: ${{ inputs.test_targets }}
        run: python3 .github/scripts/select-test-sources.py
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Boot test simulator
        timeout-minutes: 8
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          echo "TEST_UDID=$DEVICE" >> "$GITHUB_ENV"
      - name: Run requested tests with project watchdog
        timeout-minutes: 120
        env:
          TEST_TARGETS: ${{ inputs.test_targets }}
          TIMEOUT_SECS: '5400'
        run: |
          set -euo pipefail
          read -r -a TARGETS <<< "$TEST_TARGETS"
          RESULT=0
          for TARGET in "${TARGETS[@]}"; do
            LABEL=${TARGET//\//_}
            bash scripts/run-tests.sh "$TARGET" > "evidence/tests-${LABEL}.log" 2>&1 &
            TEST_PID=$!
            while kill -0 "$TEST_PID" 2>/dev/null; do
              for LOG in "${TMPDIR}"/run-tests.*; do
                [ ! -f "$LOG" ] || tail -n 3 "$LOG"
              done
              sleep 30
            done
            if ! wait "$TEST_PID"; then
              RESULT=1
            fi
            cat "evidence/tests-${LABEL}.log"
          done
          exit "$RESULT"
      - name: Build unsigned device app
        if: ${{ inputs.package_ipa }}
        run: |
          set -euo pipefail
          xcodebuild -project vreader.xcodeproj -scheme vreader \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tee evidence/device-build.log
          APP=build/Build/Products/Release-iphoneos/vreader.app
          test -f "$APP/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          lipo -verify_arch arm64 "$APP/$EXECUTABLE"
          plutil -lint "$APP/Info.plist"
          cp "$APP/Info.plist" evidence/app-info.plist
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package && /usr/bin/zip -qry ../VReader-unsigned.ipa Payload && cd ..
          unzip -t VReader-unsigned.ipa > evidence/ipa-check.txt
          shasum -a 256 VReader-unsigned.ipa > VReader-unsigned.ipa.sha256
      - name: Preserve full test diagnostics
        if: always()
        run: |
          mkdir -p evidence
          for LOG in "${TMPDIR}"/run-tests.*; do
            [ ! -f "$LOG" ] || cp "$LOG" evidence/
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 7
      - name: Upload unsigned IPA
        if: ${{ success() && inputs.package_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: VReader-unsigned-${{ github.sha }}
          path: |
            VReader-unsigned.ipa
            VReader-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
